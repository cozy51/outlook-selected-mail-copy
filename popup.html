<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>選択メールコピー</title><style>
body{font:14px/1.5 system-ui,sans-serif;width:360px;margin:0;padding:16px;color:#202936;background:#fff;box-sizing:border-box}h1{font-size:16px;margin:0 0 10px}p{margin:8px 0}#status{font-size:12px;color:#536273;margin:8px 0}#preview{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;background:#f6f8fb;border:1px solid #dce2ea;border-radius:8px;padding:12px;font-size:12px}button{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;background:#106ebe;color:white;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;gap:8px;margin-top:12px}#reload{background:#e6edf4;color:#233748}label{display:block;margin:8px 0}input{accent-color:#106ebe}select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid #c5ceda;border-radius:6px;max-width:250px}.error{color:#ad2831!important}.ok{color:#1b7a3d!important;font-weight:600}#copy.copied{background:#1b7a3d}#preview.copied{border-color:#1b7a3d;background:#f1faf4}
</style></head><body><h1>Outlook 選択メールコピー</h1><p id="status">開いているメールを確認しています…</p><label class="target">対象: <select id="target"><option value="1" selected>最新メールのみ（引用部分を除く）</option><option value="2">1件前まで遡る（2通分）</option><option value="3">2件前まで遡る（3通分）</option><option value="4">3件前まで遡る（4通分）</option><option value="5">4件前まで遡る（5通分）</option><option value="all">すべて（開いているメールをそのまま）</option></select></label><label><input type="checkbox" id="metadata" checked> 件名・差出人・日時を含める（取得できた項目のみ）</label><div id="preview">取得中…</div><div class="buttons"><button id="copy" disabled>この1件をコピー</button><button id="reload">再取得</button></div><script type="module" src="popup.js"></script></body></html>
